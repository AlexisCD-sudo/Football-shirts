name: Còpia de seguretat de la base de dades
# OPCIONAL. Només fa res si existeix el secret SUPABASE_DB_URL (cadena de connexió del «Session pooler»).
# Genera un volcat SQL de les dades i el desa com a artefacte privat del repositori durant 30 dies.
on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Volcat de la base de dades
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "Falta el secret SUPABASE_DB_URL; no es fa res."
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates gnupg lsb-release
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          mkdir -p dump
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" --data-only --schema=public --no-owner --no-privileges \
            --file=dump/dades-$(date +%F).sql
          ls -la dump
      - name: Desa el volcat
        if: ${{ hashFiles('dump/*.sql') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: copia-bd
          path: dump/
          retention-days: 30
          if-no-files-found: ignore
