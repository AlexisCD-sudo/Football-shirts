name: CI
on:
  push:
    branches: [main, 'fase-*']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instal·la dependències
        run: mkdir -p ci-logs && npm ci 2>&1 | tee ci-logs/install.txt; exit "${PIPESTATUS[0]}"
      - name: TypeScript
        run: npm run typecheck 2>&1 | tee ci-logs/typecheck.txt; exit "${PIPESTATUS[0]}"
      - name: Lint
        run: npm run lint 2>&1 | tee ci-logs/lint.txt; exit "${PIPESTATUS[0]}"
      - name: Proves
        run: npm test -- --reporter=default --reporter=github-actions 2>&1 | tee ci-logs/test.txt; exit "${PIPESTATUS[0]}"
      - name: Build
        run: npm run build 2>&1 | tee ci-logs/build.txt; exit "${PIPESTATUS[0]}"
      - name: Auditoria de dependències (informativa)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high 2>&1 | tee ci-logs/audit.txt; exit "${PIPESTATUS[0]}"
      - name: Publica registres
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-resultats
          path: |
            ci-logs/
          if-no-files-found: warn
