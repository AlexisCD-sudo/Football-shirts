name: CI
on:
  push:
    branches: [main, 'fase-*']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Sense package-lock.json encara: es genera aquí i es publica com a artefacte per commitejar-lo.
      - run: npm install
      - uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
