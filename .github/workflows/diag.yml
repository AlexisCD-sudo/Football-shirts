name: Diag npm install
on:
  push:
    branches: [diag-npm-install]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm install (com Vercel, sense memòria cau)
        run: |
          npm -v; node -v
          set +e
          npm install > install.log 2>&1
          code=$?
          echo "exit=$code"
          if [ $code -ne 0 ]; then echo "::error title=npm install ha fallat::$(grep -E 'npm error' install.log | head -30 | sed 's/npm error //' | tr '\n' '|')"; fi
          git status --short | head
          exit 0
